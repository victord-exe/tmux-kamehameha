# Config mínima para grabar los demos: servidor aparte (-L kh-demo), sin la config del usuario
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g allow-set-title off   # títulos fijos, que el shell no los pise (ni muestre el hostname)
set -g allow-rename off
