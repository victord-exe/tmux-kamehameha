# tmux-kamehameha: tema Tokyo Night + naranja, mascota animada, choose-tree, bordes, bell y splits.
# Lo carga kamehameha.tmux; no lo sources a mano.

set -g renumber-windows on                  # al cerrar una ventana se re-indexan sin huecos

# ── Theme: Tokyo Night + acento naranja (glyphs requieren Nerd Font) ──
# Paleta: naranja #ff9e64 · azul #7aa2f7 · texto #c0caf5 · dim #a9b1d6 · surface #292e42 · base #1a1b26
set -g status-position bottom               # tmux no soporta barra lateral: solo top | bottom
set -g status-style "bg=default,fg=#c0caf5" # bg transparente, se ve el wallpaper
set -g status-left-length 40
set -g status-right-length 180

# Pill de la sesión: naranja normal, azul mientras el prefix está activo
set -g status-left "#[fg=#{?client_prefix,#7aa2f7,#ff9e64}]#[bg=#{?client_prefix,#7aa2f7,#ff9e64},fg=#1a1b26,bold] #S#[bg=default,fg=#{?client_prefix,#7aa2f7,#ff9e64}]  "

set -g window-status-separator ""
set -g window-status-format "#{?window_bell_flag,#[fg=#ff9e64]#[bold]  #I #{=18:window_name} ,#[fg=#a9b1d6] #I #{=18:window_name} }"
set -g window-status-current-format "#[fg=#292e42]#[bg=#292e42,fg=#ff9e64,bold]#I #[fg=#c0caf5,nobold]#{=18:window_name}#{?window_zoomed_flag, ,}#[bg=default,fg=#292e42]"

# Derecha: otras sesiones con bell pendiente, rama git del pane, título del pane (Claude Code pone ahí la tarea), hora y fecha
# ponytail: git corre cada status-interval (1s) por pane activo; cachear en un script si algún repo se pone lento
set -g @kh_alerts "#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}},#[fg=#ff9e64]#[bold] #{session_name}#[nobold]  ,}}"
set -g @kh_git "#{?#{!=:#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null),},#[fg=#7aa2f7] #{=25:#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null)}  ,}"
set -g status-right "#{E:@kh_alerts}#{E:@kh_git}#[fg=#a9b1d6]#{=30:pane_title}  #[fg=#292e42]#[bg=#292e42,fg=#ff9e64] %H:%M #[fg=#7aa2f7]%d %b#[bg=default,fg=#292e42]"

# Mascota: guerrero cargando un kamehameha, 1 frame por segundo (%S mod 12). Ancho fijo para no mover la barra
set -g status-interval 1
set -g @kh_pt0 "#[fg=#ff9e64](ง•_•)ง       "
set -g @kh_pt1 "#[fg=#ff9e64](ﾉ•ω•)ﾉ#[fg=#7aa2f7]·      "
set -g @kh_pt2 "#[fg=#ff9e64](ﾉ•ω•)ﾉ#[fg=#7aa2f7]∘      "
set -g @kh_pt3 "#[fg=#ff9e64](ﾉ•ω•)ﾉ#[fg=#7dcfff]○      "
set -g @kh_pt4 "#[fg=#ff9e64](ﾉ•ω•)ﾉ#[fg=#7dcfff]●      "
set -g @kh_pt5 "#[fg=#ff9e64](ﾉ>ω<)ﾉ#[fg=#c0caf5]◉      "
set -g @kh_pt6 "#[fg=#ff9e64](ﾉ>ω<)ﾉ#[fg=#7aa2f7]━#[fg=#c0caf5]●     "
set -g @kh_pt7 "#[fg=#ff9e64](ﾉ>ω<)ﾉ#[fg=#7aa2f7]━#[fg=#7dcfff]━#[fg=#c0caf5]━●   "
set -g @kh_pt8 "#[fg=#ff9e64](ﾉ>ω<)ﾉ#[fg=#7aa2f7]━━#[fg=#7dcfff]━━#[fg=#c0caf5]━● "
set -g @kh_pt9 "#[fg=#ff9e64](ﾉ>ω<)ﾉ#[fg=#7aa2f7]━━#[fg=#7dcfff]━━#[fg=#c0caf5]━━✺"
set -g @kh_pt10 "#[fg=#ff9e64](ﾉ•ω•)ﾉ#[fg=#7dcfff]  ﾟ･✧  "
set -g @kh_pt11 "#[fg=#ff9e64](ง˘ω˘)ง       "
set -g @kh_pt_anim "#{?#{==:#{e|m:%S,12},0},#{E:@kh_pt0},#{?#{==:#{e|m:%S,12},1},#{E:@kh_pt1},#{?#{==:#{e|m:%S,12},2},#{E:@kh_pt2},#{?#{==:#{e|m:%S,12},3},#{E:@kh_pt3},#{?#{==:#{e|m:%S,12},4},#{E:@kh_pt4},#{?#{==:#{e|m:%S,12},5},#{E:@kh_pt5},#{?#{==:#{e|m:%S,12},6},#{E:@kh_pt6},#{?#{==:#{e|m:%S,12},7},#{E:@kh_pt7},#{?#{==:#{e|m:%S,12},8},#{E:@kh_pt8},#{?#{==:#{e|m:%S,12},9},#{E:@kh_pt9},#{?#{==:#{e|m:%S,12},10},#{E:@kh_pt10},#{E:@kh_pt11}}}}}}}}}}}}"
# Reacciones (en orden de prioridad): prefix → en guardia, pane con zoom → Super Saiyajin, batería <20% sin cargar → cansado
set -g @kh_pt_prefix "#[fg=#7aa2f7](ง°Д°)ง       "
set -g @kh_pt_ssj "#[fg=#e0af68]#[bold]#{?#{e|m:%S,2},ϟ(ﾉ>Д<)ﾉϟ,✧(ﾉ>Д<)ﾉ✧}#[nobold]     "
set -g @kh_pt_tired "#[fg=#a9b1d6](ﾉ-ω-)ﾉ zzz   "
set -g @kh_bat "#(pmset -g batt | awk '/discharging/{print $3+0}')"
set -g @kh_pet "#{?client_prefix,#{E:@kh_pt_prefix},#{?window_zoomed_flag,#{E:@kh_pt_ssj},#{?#{&&:#{E:@kh_bat},#{e|<:#{E:@kh_bat},20}},#{E:@kh_pt_tired},#{E:@kh_pt_anim}}}}"

# Aviso cuando Claude termina: los hooks Stop/Notification suenan la bell en su pane (extras/claude-code/tmux-bell.sh)
set -g monitor-bell on
set -g bell-action other                    # la ventana donde estás no suena, las demás sí
set -g visual-bell off

# Panes inactivos atenuados (solo afecta el texto sin color propio)
set -g window-style "fg=#a9b1d6"
set -g window-active-style "fg=default"

# Bordes con etiqueta: número, comando y título de cada pane. Solo con 2+ panes, si no se come una línea
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g pane-border-format "#{?pane_active,#[fg=#ff9e64]#[bold],#[fg=#a9b1d6]} #{pane_index} #{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}#[nobold]#{?#{!=:#{pane_title},#{host}}, · #{=40:pane_title},} "

# Splits que abren en la carpeta del pane actual
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Popups de los pickers (los binds de f/g están en kamehameha.tmux)
set -g popup-border-style "fg=#ff9e64"
set -g popup-border-lines rounded

set -g pane-border-style "fg=#545c7e"
set -g pane-active-border-style "fg=#ff9e64"
set -g message-style "bg=#292e42,fg=#ff9e64"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#3b4261"              # selección (copy-mode y choose-tree); sin fg para no tapar los colores inline

# choose-tree (prefix s / w): etiquetas del preview y formato de cada línea
# ponytail: estilos separados #[fg=..]#[bold] porque una coma dentro de #{?..} rompe el condicional
set -g display-panes-colour "#a9b1d6"
set -g display-panes-active-colour "#ff9e64"
set -g @kh_tree_fmt "#{?pane_format,#[fg=#a9b1d6]#{pane_current_command}#{?pane_active, #[fg=#ff9e64]●,},#{?window_format,#{?window_bell_flag,#[fg=#ff9e64] ,}#[fg=#c0caf5]#{window_name}#[fg=#a9b1d6]#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{!=:#{pane_title},#{host}}},  #{pane_title},},#{?session_alerts,#[fg=#ff9e64] ,}#[fg=#ff9e64]#[bold]#{session_name}#[nobold]#[fg=#a9b1d6]  #{session_windows} win#{?session_attached, #[fg=#7aa2f7]● attached,}}}"
bind s choose-tree -Zs -F "#{E:@kh_tree_fmt}"
bind w choose-tree -Zw -F "#{E:@kh_tree_fmt}"
